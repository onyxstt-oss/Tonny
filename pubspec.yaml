name: apple_music_yt_downloader
description: Reproductor estilo Apple Music con navegador YouTube, descargas MP3/M4A/MP4, playlists, cola y letras.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  webview_flutter: ^4.7.0
  youtube_explode_dart: ^2.2.1
  just_audio: ^0.9.38
  audio_session: ^0.1.19
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  http: ^1.2.1
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
